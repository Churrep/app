services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17}
    environment:
      POSTGRES_USER: music
      POSTGRES_PASSWORD: music
      POSTGRES_DB: music
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music -d music"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Go-сервер с FFmpeg. Код для входа смотреть: docker compose logs -f app
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://music:music@postgres:5432/music?sslmode=disable
      COOKIE_SECURE: "false"
      # Порт сервера открыт только для этого компьютера, снаружи запросы приходят через Vite и туннель Cloudflare.
      TRUST_PROXY: "true"
      SMS_LOG_CODES: "true"
      MEDIA_SECRET: ${MEDIA_SECRET:-local-dev-media-secret}
      SMSRU_API_ID: ${SMSRU_API_ID:-}
      SMSRU_TEST: ${SMSRU_TEST:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - media:/data/media
    restart: unless-stopped

volumes:
  pgdata:
  media:
